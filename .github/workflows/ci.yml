name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain # zizmor: ignore[self-repository]
        with:
          node-version: aqua
          bun-version: aqua
          bun-cache: "true"

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Print versions
        shell: bash
        run: |
          uname -a || ver
          node -v
          bun -v

      - name: Check root formatting
        shell: bash
        run: bun run format:oxfmt:check

      - name: Lint TypeScript
        shell: bash
        run: bun run lint:oxlint

      - name: Typecheck frontend
        shell: bash
        run: bun run --cwd frontend typecheck

      - name: Build frontend
        shell: bash
        run: bun run --cwd frontend build

  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Print versions
        if: runner.os != 'Windows'
        shell: bash
        run: |
          java -version
          cd backend
          chmod +x ./gradlew
          ./gradlew --version

      - name: Print versions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          java -version
          cd backend
          .\gradlew.bat --version

      - name: Build and test backend
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd backend
          chmod +x ./gradlew
          ./gradlew --no-daemon build

      - name: Build and test backend
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd backend
          .\gradlew.bat --no-daemon build

  status-check:
    name: CI status check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs:
      - frontend
      - backend
    steps:
      - name: Check required job results
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          if [ "$FRONTEND_RESULT" = "success" ] && [ "$BACKEND_RESULT" = "success" ]; then
            exit 0
          fi
          echo "frontend result: $FRONTEND_RESULT"
          echo "backend result: $BACKEND_RESULT"
          exit 1

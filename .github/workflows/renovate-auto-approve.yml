name: Renovate auto approve

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled

permissions: {}

jobs:
  approve:
    name: Auto approve Renovate PR
    uses: watanabe-1/github-actions-common/.github/workflows/renovate-auto-approve.yml@15224360f072051b948762dee6dc85bad60a17f2 # v1.2.6
    permissions:
      pull-requests: write

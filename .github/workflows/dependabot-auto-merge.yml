name: Dependabot auto merge

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Dependabot metadata only; this workflow never checks out or executes PR code.
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

jobs:
  auto-merge:
    name: Auto approve and enable auto-merge
    uses: watanabe-1/github-actions-common/.github/workflows/dependabot-auto-merge.yml@0e9b6763a2f343233b82faed14089cf328d8f4b3 # v1.2.5
    permissions:
      contents: write
      pull-requests: write

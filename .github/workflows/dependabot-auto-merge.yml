name: Dependabot auto merge

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Dependabot metadata only; this workflow never checks out or executes PR code.
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

jobs:
  auto-merge:
    name: Auto approve and enable auto-merge
    uses: watanabe-1/github-actions-common/.github/workflows/dependabot-auto-merge.yml@15224360f072051b948762dee6dc85bad60a17f2 # v1.2.6
    permissions:
      contents: write
      pull-requests: write

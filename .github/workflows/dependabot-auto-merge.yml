name: Dependabot auto merge

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Dependabot metadata only; this workflow never checks out or executes PR code.
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

jobs:
  auto-merge:
    name: Auto approve and enable auto-merge
    uses: watanabe-1/github-actions-common/.github/workflows/dependabot-auto-merge.yml@c24a1f966b3d2d20ca30379e5a27ed137bfe760f # v1.0.2
    permissions:
      contents: write
      pull-requests: write
